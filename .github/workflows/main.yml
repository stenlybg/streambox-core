name: Repackage Decompiled APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Download Apktool
        run: wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          
      - name: Build APK with Apktool
        run: java -jar apktool.jar b . -o streambox-unsigned.apk
        
      - name: Generate Keystore and Sign APK
        run: |
          sudo apt-get update
          sudo apt-get install apksigner -y
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out streambox-signed.apk streambox-unsigned.apk
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: streambox-ready
          path: streambox-signed.apk
